name: FTP Connection Test

on:
  workflow_dispatch:

jobs:
  ftp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create test directory
        run: |
          mkdir ftp-test
          echo "FTP connection test - $(date -u)" > ftp-test/test-ftp.txt

      - name: Upload test file
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 185.164.72.123
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./ftp-test/
          server-dir: ./
